name: Build and Deploy WebGL 🚀

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Project 🛠️
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          lfs: true
      
      - name: Cache Library 💾
        uses: actions/cache@v3
        with:
          path: src/Library
          key: Library-src-WebGL-${{ github.sha }}
          restore-keys: |
            Library-src-WebGL-
            Library-
          
      - name: Build Unity WebGL 🏗️
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          # UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }} # השתמש בזה אם ה-License לא מספיק
        with:
          projectPath: src 
          buildName: WebGL-Build
          targetPlatform: WebGL
          unityVersion: 6000.3.0f1

      - name: Upload Build Artifact 📦
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build-Artifact
          path: build/WebGL/WebGL # Unity Builder לרוב יוצר תיקייה נוספת עם שם הפלטפורמה

  deploy:
    name: Deploy to GitHub Pages 🌐
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # נחוץ כדי ש-Action הדיפלוי יוכל לכתוב ל-gh-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build-Artifact
          path: deploy-folder

      - name: Display structure for debugging
        run: ls -R deploy-folder

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy-folder
          branch: gh-pages
          clean: true # פותר את בעיית ה-Dirty Branch על ידי ניקוי קבצים לא רלוונטיים

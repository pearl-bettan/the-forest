name: Build and Deploy WebGL + .NET 🚀

on:
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Job 1: Build Unity WebGL Output
  # -------------------------------------------------------------
  build-unity:
    name: Build Unity Project 🛠️
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          lfs: true

      - name: Cache Library 💾
        uses: actions/cache@v3
        with:
          path: src/unity/Library
          key: Library-src-unity-WebGL-${{ github.sha }}
          restore-keys: |
            Library-src-unity-WebGL-
            Library-

      - name: Build Unity WebGL 🏗️
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: src/unity
          buildName: Game
          targetPlatform: WebGL
          unityVersion: 6000.3.0f1
          versioning: None
          allowDirtyBuild: true

      - name: Upload Build Artifact 📦
        uses: actions/upload-artifact@v4
        with:
          name: unity-webgl-build
          path: build/WebGL/Game

  # -------------------------------------------------------------
  # Job 2: Build .NET App, Embed Unity WebGL into wwwroot/Game & Deploy
  # -------------------------------------------------------------
  build-and-deploy:
    name: Publish .NET & Deploy to OCI 🚀
    needs: build-unity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Unity WebGL Artifact to wwwroot/Game 📥
        uses: actions/download-artifact@v4
        with:
          name: unity-webgl-build
          path: src/Portelem/wwwroot/Game

      - name: Publish .NET Application ⚙️
        run: |
          cd src/Portelem
          dotnet publish -c Release -o ./publish --no-self-contained

      - name: Deploy to OCI Server via SSH 📤
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "src/Portelem/publish/*"
          target: "/home/ubuntu/FinalProject/publish"
          strip_components: 3

      - name: Restart Systemd Service 🔄
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl restart FinalProject.service
            sudo systemctl status FinalProject.service --no-pager

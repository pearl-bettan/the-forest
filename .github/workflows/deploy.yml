# ============================================================================
#  יער הידע - בנייה ופריסה מלאה (המקבילה של build-all.sh ב-GitHub Actions)
#
#  1. בניית המשחק ל-WebGL, דרך אותה מתודה שהסקריפט המקומי מריץ:
#     WebGLExport.BuildFromCommandLine  (Brotli, Data Caching כבוי, CSS מותאם)
#  2. פרסום המחולל   dotnet publish -c Release  על פרויקט ה-Server
#  3. השתלת המשחק בתוך wwwroot/Game של הפרסום
#  4. חותמת מטמון על קבצי ה-CSS ב-index.html
#  5. העתקה לשרת ה-OCI והפעלה מחדש של השירות
#
#  Secrets נדרשים:
#     UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD
#     SERVER_HOST / SERVER_USER / SSH_PRIVATE_KEY
# ============================================================================
name: Build and Deploy Unity + .NET Web App

on:
  workflow_dispatch:
    inputs:
      base_href:
        description: 'base href בפרסום (כמו --base ב-build-all.sh)'
        required: false
        default: '/FinalProject/'
      dev_build:
        description: 'בניית Development של יוניטי (איטית, עם דיבאג)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  UNITY_PROJECT: src/unity
  SERVER_PROJ: src/Portelem/Server/AuthTemplate.Server.csproj
  GAME_DIR: src/Portelem/Client/wwwroot/Game
  DEPLOY_TARGET: /home/ubuntu/FinalProject
  SERVICE_NAME: FinalProject.service
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  # -------------------------------------------------------------------------
  # שלב 1: בניית המשחק ל-WebGL   (build-all.sh, שלב 2/3)
  # -------------------------------------------------------------------------
  build-unity:
    name: Build Unity WebGL 🏗️
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # הראנר של GitHub מגיע כמעט מלא. בניית WebGL צורכת הרבה מקום.
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Read Unity Version
        id: unity
        run: |
          VERSION="$(sed -n 's/^m_EditorVersion: //p' "$UNITY_PROJECT/ProjectSettings/ProjectVersion.txt" | tr -d '\r')"
          if [ -z "$VERSION" ]; then
            echo "::error::לא הצלחתי לקרוא את גרסת היוניטי מ-ProjectSettings/ProjectVersion.txt"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "יוניטי: $VERSION"

      - name: Cache Unity Library 💾
        uses: actions/cache@v4
        with:
          path: src/unity/Library
          key: Library-WebGL-${{ hashFiles('src/unity/Packages/packages-lock.json') }}-${{ hashFiles('src/unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-WebGL-${{ hashFiles('src/unity/Packages/packages-lock.json') }}-
            Library-WebGL-
            Library-

      # אותה מתודה שה-build-all.sh מריץ מקומית, עם אותו -outputPath.
      # היא שקובעת Brotli, dataCaching כבוי, וה-CSS שמתאים את הקנבס ל-iframe.
      - name: Build Unity WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: src/unity
          targetPlatform: WebGL
          unityVersion: ${{ steps.unity.outputs.version }}
          buildName: Game
          buildsPath: build
          buildMethod: WebGLExport.BuildFromCommandLine
          allowDirtyBuild: true
          customParameters: -outputPath /github/workspace/build/WebGL/Game ${{ inputs.dev_build && '-developmentBuild' || '' }}

      # יוניטי רצה ב-docker כ-root, הקבצים שנוצרו שייכים ל-root
      - name: Fix Build Permissions & Verify
        run: |
          sudo chown -R "$USER:$USER" build
          if [ ! -f build/WebGL/Game/index.html ]; then
            echo "::error::הבנייה הסתיימה אבל לא נוצר build/WebGL/Game/index.html"
            ls -R build || true
            exit 1
          fi
          echo "גודל הבנייה: $(du -sh build/WebGL/Game | cut -f1)"

      - name: Upload Unity WebGL Artifact 📦
        uses: actions/upload-artifact@v4
        with:
          name: unity-webgl-build
          path: build/WebGL/Game
          retention-days: 7
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # שלב 2: פרסום המחולל, שילוב המשחק ופריסה לשרת
  #        (build-all.sh, שלבים 1/3 ו-3/3)
  # -------------------------------------------------------------------------
  build-and-deploy:
    name: Publish .NET & Deploy to OCI 🚀
    needs: build-unity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ניקוי המשחק הישן שיושב ב-repo, כדי שהפרסום לא יגרור בנייה מיושנת
      - name: Clean Stale Game Folder
        run: rm -rf "$GAME_DIR"

      - name: Publish .NET Application
        run: |
          dotnet publish "$SERVER_PROJ" \
            -c Release \
            -o publish \
            --nologo \
            -p:BaseHref='${{ inputs.base_href }}'
          if [ ! -d publish/wwwroot ]; then
            echo "::error::הפרסום הסתיים אבל לא נוצרה publish/wwwroot"
            exit 1
          fi

      - name: Download Unity WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: unity-webgl-build
          path: publish/wwwroot/Game

      - name: Verify Game In Place
        run: |
          if [ ! -f publish/wwwroot/Game/index.html ]; then
            echo "::error::המשחק לא הושתל ב-publish/wwwroot/Game"
            exit 1
          fi
          echo "המשחק: $(du -sh publish/wwwroot/Game | cut -f1)"

      # חותמת על כתובות ה-CSS, כדי שדפדפן לא יגיש גרסה ישנה מהמטמון.
      # החותמת היא גיבוב של תוכן ה-CSS, ולכן משתנה רק כשהעיצוב באמת השתנה.
      - name: Stamp CSS Cache Buster
        run: |
          IDX="publish/wwwroot/index.html"
          if [ ! -f "$IDX" ]; then
            echo "::warning::לא מצאתי את $IDX - לא הוטבעה חותמת מטמון"
            exit 0
          fi
          SOURCES=""
          if [ -f publish/wwwroot/css/app.css ]; then
            SOURCES="$SOURCES publish/wwwroot/css/app.css"
          fi
          if [ -f publish/wwwroot/AuthTemplate.Client.styles.css ]; then
            SOURCES="$SOURCES publish/wwwroot/AuthTemplate.Client.styles.css"
          fi
          if [ -n "$SOURCES" ]; then
            STAMP="$(cat $SOURCES | md5sum | cut -c1-10)"
          else
            STAMP="$(date +%Y%m%d%H%M%S)"
          fi
          sed -i -E "s#href=\"(css/app\.css|AuthTemplate\.Client\.styles\.css)(\?v=[^\"]*)?\"#href=\"\1?v=$STAMP\"#g" "$IDX"
          echo "חותמת מטמון: ?v=$STAMP"
          grep -o 'href="[^"]*\.css[^"]*"' "$IDX" || true

      # ה-DB נכלל בפרסום, אבל אסור לו לדרוס את בסיס הנתונים החי שבשרת.
      # מוציאים אותו מהחבילה, ומעלים בנפרד - נשתל רק אם אין כזה בשרת.
      - name: Separate Database Seed
        run: |
          mkdir -p db-seed
          if [ -f publish/FinalProjectDB.db ]; then
            mv publish/FinalProjectDB.db db-seed/FinalProjectDB.db
            echo "ה-DB הוצא מחבילת הפריסה, יועלה כזרע בלבד"
          else
            echo "אין FinalProjectDB.db בפרסום"
            : > db-seed/.empty
          fi

      - name: Stop Service on Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl stop ${{ env.SERVICE_NAME }} || true
            mkdir -p ${{ env.DEPLOY_TARGET }}
            rm -rf ${{ env.DEPLOY_TARGET }}/.db-seed

      - name: Copy Published App to OCI Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "publish/*"
          target: ${{ env.DEPLOY_TARGET }}
          strip_components: 1
          overwrite: true

      - name: Copy Database Seed
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "db-seed/*"
          target: ${{ env.DEPLOY_TARGET }}/.db-seed
          strip_components: 1
          overwrite: true

      - name: Seed DB If Missing & Restart Service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ env.DEPLOY_TARGET }}

            if [ -f FinalProjectDB.db ]; then
              echo "בסיס נתונים קיים בשרת - לא נוגעים בו"
            elif [ -f .db-seed/FinalProjectDB.db ]; then
              cp .db-seed/FinalProjectDB.db FinalProjectDB.db
              echo "בסיס נתונים הותקן מהזרע (פריסה ראשונה)"
            else
              echo "אין בסיס נתונים ואין זרע"
            fi

            rm -rf .db-seed

            sudo systemctl restart ${{ env.SERVICE_NAME }}
            sleep 3
            sudo systemctl status ${{ env.SERVICE_NAME }} --no-pager

name: Build and Deploy Unity + .NET Web App
on:
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Job 1: Build Unity WebGL Output
  # -------------------------------------------------------------
  build-unity:
    name: Build Unity WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: unity-app/Library
          key: Library-Unity-${{ hashFiles('unity-app/Packages/manifest.json') }}
          restore-keys: |
            Library-Unity-

      - name: Build Unity Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity-app
          targetPlatform: WebGL
          buildName: WebGL

      - name: Upload Unity WebGL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-webgl-build
          path: build/WebGL/WebGL

  # -------------------------------------------------------------
  # Job 2: Build .NET App, Combine wwwroot, & Deploy via SSH
  # -------------------------------------------------------------
  build-and-deploy:
    name: Publish .NET & Deploy to OCI
    needs: build-unity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Unity WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: unity-webgl-build
          path: dotnet-app/wwwroot

      - name: Publish .NET Application
        run: |
          cd dotnet-app
          dotnet publish -c Release -o ./publish --no-self-contained

      - name: Deploy to OCI Server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dotnet-app/publish/*"
          target: "/home/ubuntu/FinalProject/publish"
          strip_components: 2

      - name: Restart Systemd Service on Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl restart FinalProject.service
            sudo systemctl status FinalProject.service --no-pager

name: Unity - Request Activation File (ALF)

on:
  workflow_dispatch:   # manual trigger from GitHub UI

jobs:
  request-activation:
    name: Generate Unity .alf file
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Cache Unity (optional but speeds up repeated runs)
      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-alf-${{ runner.os }}
          restore-keys: |
            Library-alf-

      - name: Request Unity Activation File
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 2022.3.20f1   # 🔁 CHANGE to your Unity version

      - name: Upload .alf file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: "*.alf"
